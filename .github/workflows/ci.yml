name: CI
on:
  push:
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: server } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: server/go.mod, cache-dependency-path: server/go.sum }
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - run: CGO_ENABLED=0 go build -trimpath -o /tmp/thevault ./cmd/thevault

  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npm test
      - run: npm run check:sync
      - run: for f in $(git ls-files 'server/internal/web/static/js/**/*.js' 'extension/**/*.js'); do node --check "$f"; done
      - run: python3 tests/contrast.py

  browser:
    runs-on: ubuntu-latest
    needs: [server, javascript]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: server/go.mod, cache-dependency-path: server/go.sum }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npx playwright-core install --with-deps chromium
      - run: node tests/ui/run.mjs
      - run: node tests/ext/run.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: screenshots, path: tests/ui/out }

  image:
    runs-on: ubuntu-latest
    needs: server
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f deploy/Dockerfile -t thevault:ci .
