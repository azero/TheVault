{{define "bodyclass"}}auth-body{{end}}
{{define "content"}}
<main id="main" class="auth-wrap">
  <section class="auth-card">
    <h1 class="logo-h"><img class="logo" src="/static/brand/thevault-logo.webp" width="760" height="253" alt="TheVault"></h1>
    <h2>Something went wrong</h2>
    <p class="alert alert-error" role="alert">{{.Msg}}</p>
    <p><a class="btn btn-block" href="/login">Back to sign in</a></p>
  </section>
</main>
{{end}}
